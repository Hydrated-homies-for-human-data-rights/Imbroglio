name: Health watch

# Every 30 minutes, checks that Imbroglio is up and moving, and posts to
# Discord only when something needs a look (plus a short "running normally"
# line once a day). What it checks, in .github/scripts/health.mjs:
#   * imbroglio.io answers, with its security headers
#   * the API answers, and its queue, worker and budget numbers
#     (GET /v1/health) show no problem
#   * the latest commit on main got its Vercel and Railway deploys
#
# Secrets in this repo's Actions settings:
#   DISCORD_HEALTH_WEBHOOK   a webhook URL for the channel to post in
#                            (Discord: channel settings > Integrations >
#                            Webhooks > New Webhook > Copy Webhook URL).
#                            Moving to another server or channel means
#                            replacing only this.
#   IMBROGLIO_API_URL        the API's address, as the website uses it
#   IMBROGLIO_API_USER       the API login, as the website uses it
#   IMBROGLIO_API_PASSWORD
# Without the webhook it still runs and writes what it found to the run's
# summary, posting nothing. It never fails the run over a problem it finds,
# so nobody gets a GitHub email every half hour.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_HEALTH_WEBHOOK: ${{ secrets.DISCORD_HEALTH_WEBHOOK }}
      IMBROGLIO_API_URL: ${{ secrets.IMBROGLIO_API_URL }}
      IMBROGLIO_API_USER: ${{ secrets.IMBROGLIO_API_USER }}
      IMBROGLIO_API_PASSWORD: ${{ secrets.IMBROGLIO_API_PASSWORD }}
      GITHUB_TOKEN: ${{ github.token }}
      STATE_FILE: .health-state.json
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      # What was wrong last time, so a problem is posted when it starts and
      # when it clears, not every half hour in between.
      - uses: actions/cache/restore@v4
        with:
          path: .health-state.json
          key: health-state-${{ github.run_id }}
          restore-keys: health-state-
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node .github/scripts/health.mjs
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .health-state.json
          key: health-state-${{ github.run_id }}
