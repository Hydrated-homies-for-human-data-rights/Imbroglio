name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: imbroglio
          POSTGRES_PASSWORD: imbroglio
          POSTGRES_DB: imbroglio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imbroglio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # The website: lint, type-check and build, so a broken page fails here
  # instead of on Vercel. Needs no API: pages read it at request time.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
