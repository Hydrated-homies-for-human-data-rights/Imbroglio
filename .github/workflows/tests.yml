name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: imbroglio
          POSTGRES_PASSWORD: imbroglio
          POSTGRES_DB: imbroglio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imbroglio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
