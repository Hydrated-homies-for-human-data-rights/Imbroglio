<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Imbroglio</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="popup">
    <header class="top" aria-label="Imbroglio">
      <!-- the wordmark: the logo's dotted i stands in for the first letter -->
      <svg class="logo-i" viewBox="380 160 270 670" aria-hidden="true">
        <circle cx="544" cy="260" r="92" fill="#c0392b"/>
        <path fill="currentColor" d="M450 398C478 382 530 378 560 402C588 425 585 465 565 505L492 632C478 658 485 690 510 705C527 715 545 715 560 710L583 795C555 815 525 823 497 822C450 821 410 800 393 760C378 723 385 670 405 630L478 492C492 465 485 448 470 440C460 434 446 432 436 433Z"/>
      </svg>
      <span aria-hidden="true">mbroglio<b>.</b></span>
    </header>

    <section class="card">
      <h1 id="domain" class="domain"><span class="skeleton" style="width: 55%"></span></h1>
      <div id="rating" class="rating"><span class="skeleton" style="width: 40%"></span></div>
      <p id="because" class="because"><span class="skeleton" style="width: 70%"></span></p>
      <ul id="categories" class="categories">
        <li><span class="skeleton" style="width: 100%"></span></li>
        <li><span class="skeleton" style="width: 100%"></span></li>
        <li><span class="skeleton" style="width: 100%"></span></li>
        <li><span class="skeleton" style="width: 100%"></span></li>
        <li><span class="skeleton" style="width: 100%"></span></li>
        <li><span class="skeleton" style="width: 100%"></span></li>
        <li><span class="skeleton" style="width: 100%"></span></li>
      </ul>
      <p id="message" class="message" hidden></p>
    </section>

    <footer class="foot">
      <p id="meta" class="meta"></p>
      <a id="cta" class="button" hidden></a>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
