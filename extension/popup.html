<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Imbroglio</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Three screens from the UX team's Figma (imbroglio browser extension):
       the overview, the category breakdown, and what you can do. The popup
       has one fixed size; popup.js slides one screen in at a time. -->
  <main id="popup">

    <section id="overview" class="screen" aria-labelledby="domain">
      <header class="bar bar-home">
        <a id="site-link" class="wordmark" href="https://imbroglio.io" title="Open imbroglio.io" aria-label="Imbroglio, open imbroglio.io">
          <!-- the wordmark: the logo's dotted i stands in for the first letter -->
          <svg class="logo-i" viewBox="380 160 270 670" aria-hidden="true">
            <circle cx="544" cy="260" r="92" fill="#c0392b"/>
            <path fill="currentColor" d="M450 398C478 382 530 378 560 402C588 425 585 465 565 505L492 632C478 658 485 690 510 705C527 715 545 715 560 710L583 795C555 815 525 823 497 822C450 821 410 800 393 760C378 723 385 670 405 630L478 492C492 465 485 448 470 440C460 434 446 432 436 433Z"/>
          </svg><span aria-hidden="true">mbroglio<b>.</b></span>
        </a>
      </header>

      <div class="body">
        <div class="site">
          <span id="favicon" class="favicon" aria-hidden="true"></span>
          <div class="site-text">
            <h1 id="domain" class="domain"><span class="skeleton" style="width: 55%"></span></h1>
            <p id="checked" class="checked"><span class="skeleton" style="width: 40%"></span></p>
          </div>
        </div>

        <div id="concern" class="concern">
          <div class="concern-head">
            <span id="concern-mark" class="mark big" aria-hidden="true"></span>
            <div>
              <p id="concern-title" class="concern-title"><span class="skeleton" style="width: 60%"></span></p>
              <p id="concern-text" class="concern-text"><span class="skeleton" style="width: 90%"></span></p>
            </div>
          </div>
          <ul id="tiles" class="tiles" aria-label="Categories by rating"></ul>
        </div>

        <p id="flags-label" class="label">Biggest flags</p>
        <ul id="flags" class="rows" aria-label="Biggest flags">
          <li class="row"><span class="skeleton" style="width: 100%"></span></li>
          <li class="row"><span class="skeleton" style="width: 100%"></span></li>
          <li class="row"><span class="skeleton" style="width: 100%"></span></li>
        </ul>

        <p id="message" class="message" hidden></p>
        <button id="see-all" class="button primary wide" type="button" hidden>See all 7 categories</button>
        <a id="cta" class="button primary wide" hidden></a>
      </div>

      <footer class="foot">
        <label class="switch-row">
          <span>Warn me on Extensive sites</span>
          <input id="warn" type="checkbox" class="switch" role="switch">
        </label>
      </footer>
    </section>

    <section id="breakdown" class="screen" hidden aria-labelledby="breakdown-title">
      <header class="bar">
        <button class="round back" type="button" data-go="overview" aria-label="Back to the overview">
          <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5 6.5 10l5.5 5.5"/></svg>
        </button>
        <div class="bar-text">
          <h2 id="breakdown-title">Category breakdown</h2>
          <p class="bar-domain" data-domain></p>
        </div>
      </header>
      <div class="body">
        <div class="list-head">
          <span class="label" id="categories-label">7 categories</span>
          <button id="collapse" class="link" type="button" hidden>Collapse all</button>
        </div>
        <ul id="categories" class="rows" aria-labelledby="categories-label"></ul>
      </div>
      <footer class="foot buttons">
        <button class="button primary" type="button" data-go="actions">What can I do?</button>
        <a id="report-link" class="button secondary" href="https://imbroglio.io">Full report</a>
      </footer>
    </section>

    <section id="actions" class="screen" hidden aria-labelledby="actions-title">
      <header class="bar">
        <button class="round back" type="button" data-go="breakdown" aria-label="Back to the categories">
          <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5 6.5 10l5.5 5.5"/></svg>
        </button>
        <div class="bar-text">
          <h2 id="actions-title">What you can do</h2>
          <p class="bar-domain" data-domain></p>
        </div>
      </header>
      <div class="body">
        <p id="actions-intro" class="intro">For this site’s flags, what you can change if you want to. A button opens the site’s own page for it; “how” has the steps.</p>
        <ul id="action-cards" class="cards" aria-label="What you can do"></ul>
      </div>
      <footer class="foot between">
        <span>None of this is required.</span>
        <button class="link" type="button" data-go="breakdown">Back to categories</button>
      </footer>
    </section>

  </main>
  <script src="popup.js"></script>
</body>
</html>
