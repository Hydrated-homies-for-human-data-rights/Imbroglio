# Railway config-as-code. In the Railway service settings, set the root
# directory to /pipeline so this file and the Dockerfile are picked up.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
