<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imbroglio prototype</title>
<style>
  body { max-width: 800px; margin: 20px auto; padding: 0 10px; font-family: sans-serif; }
  #log { background: #f0f0f0; padding: 10px; min-height: 60px; max-height: 300px;
         overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
  #results { font-family: monospace; font-size: 14px; white-space: pre-wrap; }
  .card-head { display: flex; align-items: center; gap: 12px; margin: 6px 0; font-family: sans-serif; }
  .card-domain { font-size: 22px; font-weight: bold; }
  .tier { font-family: sans-serif; font-weight: bold; font-size: 13px; padding: 2px 8px; border: 2px solid; border-radius: 3px; white-space: nowrap; }
  .t-severe { color: #b00020; } .t-extensive { color: #c25400; } .t-moderate { color: #8a6d00; }
  .t-limited { color: #1b7a2e; } .t-nd { color: #666; border-style: dashed; }
  .cats { white-space: normal; font-family: sans-serif; margin-top: 10px; max-width: 760px; }
  .cat { border-top: 1px solid #ddd; padding: 6px 0; }
  .cat summary { cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .cat-name { width: 220px; }
  .ev { margin: 8px 0 8px 24px; }
  .ev-claim { font-weight: bold; }
  .ev blockquote { margin: 4px 0; padding: 4px 10px; border-left: 3px solid #999; background: #f7f7f7; font-family: Georgia, serif; }
  .muted { color: #666; font-size: 13px; font-family: sans-serif; white-space: normal; }
  .todo { margin: 6px 0; font-family: sans-serif; white-space: normal; }
  .todo summary { cursor: pointer; color: #0645ad; }
  .todo ul { margin: 4px 0; padding-left: 20px; }
  .ok { color: green; }
  .bad { color: red; }
  table { border-collapse: collapse; font-size: 14px; }
  th, td { border: 1px solid #999; padding: 4px 10px; text-align: left; }
  #detail pre { background: #f0f0f0; padding: 10px; max-height: 400px; overflow-y: auto;
                font-size: 12px; white-space: pre-wrap; }
  #detail { font-family: monospace; font-size: 13px; }
</style>
</head>
<body>
  <h1>Imbroglio prototype</h1>
  <p><a href="/audit">Audit extraction results</a> · <a href="/learn">What can you do? (learn)</a></p>
  <p>Type a website, it tries to find + extract the privacy policy and terms of service.
     <span id="db"></span></p>

  <form id="form">
    <input type="text" id="domain" placeholder="e.g. notion.so or just notion" size="30" autofocus list="suggest" autocomplete="off">
    <datalist id="suggest"></datalist>
    <button id="go" type="submit">Analyze</button>
    <button id="recheck" type="button" disabled>Re-check now</button>
    <label><input type="checkbox" id="pw" checked> browser fallback</label>
  </form>

  <h3>Log</h3>
  <div id="log">(waiting)</div>

  <h3>Results</h3>
  <div id="results">(none yet)</div>

  <h3>Queue <span id="queueCount"></span></h3>
  <div id="queue">(loading)</div>

  <h3>Cached websites <span id="cachedCount"></span></h3>
  <div id="cached">(loading)</div>
  <div id="detail"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  fetch("/api/health").then(r => r.json())
    .then(h => { $("db").textContent = h.db ? "(db: connected)" : "(db: offline, dry run)"; })
    .catch(() => { $("db").textContent = "(server unreachable)"; });

  async function loadCached() {
    try {
      const data = await (await fetch("/api/services")).json();
      if (!data.db) { $("cached").textContent = "(database offline)"; return; }
      const withDocs = data.services.filter(s => s.docs.length).length;
      $("cachedCount").textContent = `(${withDocs} with documents, ${data.services.length} attempted)`;
      if (!data.services.length) { $("cached").textContent = "(nothing cached yet)"; return; }
      const cell = (docs, type) => {
        const d = docs.find(x => x.doc_type === type);
        if (!d) return "&mdash;";
        return `${d.versions} version${d.versions === 1 ? "" : "s"}` +
               (d.changes ? `, <b>${d.changes} change${d.changes === 1 ? "" : "s"}</b>` : "");
      };
      const rated = data.services.filter(s => s.rating).length;
      $("cachedCount").textContent += ` · ${rated} rated`;
      // rated sites first, worst rating first, so the scorecards are easy to find
      const order = { SEVERE: 0, EXTENSIVE: 1, MODERATE: 2, LIMITED: 3, NOT_DISCLOSED: 4 };
      data.services.sort((a, b) => (a.rating ? order[a.rating] : 9) - (b.rating ? order[b.rating] : 9) || a.domain.localeCompare(b.domain));
      let html = "<table><tr><th>domain</th><th>rating</th><th>privacy</th><th>terms</th><th>last checked</th><th></th></tr>";
      for (const s of data.services) {
        const last = s.docs.map(d => d.last_fetched).filter(Boolean).sort().pop();
        html += `<tr>
          <td>${esc(s.domain)}</td>
          <td>${s.rating ? `<span class="tier ${TIER[s.rating].cls}">${TIER[s.rating].shape} ${TIER[s.rating].label}</span>` : '<span class="muted">not rated</span>'}</td>
          <td>${cell(s.docs, "privacy")}</td>
          <td>${cell(s.docs, "terms")}</td>
          <td>${last ? esc(last.slice(0, 16).replace("T", " ")) : "&mdash;"}</td>
          <td><a href="#" data-domain="${esc(s.domain)}" class="card">scorecard</a> · <a href="#" data-domain="${esc(s.domain)}" class="view">text</a></td>
        </tr>`;
      }
      $("cached").innerHTML = html + "</table>";
      for (const a of document.querySelectorAll("a.card")) {
        a.addEventListener("click", async (e) => {
          e.preventDefault();
          currentDomain = a.dataset.domain; $("recheck").disabled = false;
          $("log").textContent = ""; await showSite(a.dataset.domain, "Cached result.");
          $("results").scrollIntoView({ behavior: "smooth" });
        });
      }
      for (const a of document.querySelectorAll("a.view")) {
        a.addEventListener("click", (e) => { e.preventDefault(); viewService(a.dataset.domain); });
      }
    } catch { $("cached").textContent = "(failed to load cached list)"; }
  }

  async function viewService(domain) {
    $("detail").textContent = "(loading " + domain + "...)";
    try {
      const resp = await fetch("/api/service/" + encodeURIComponent(domain));
      const data = await resp.json();
      if (!resp.ok) { $("detail").textContent = "Error: " + (data.error || resp.status); return; }
      let html = `<h4>${esc(data.domain)}</h4>`;
      for (const d of data.docs) {
        const name = d.doc_type === "privacy" ? "privacy policy" : "terms of service";
        const safeUrl = /^https?:\/\//i.test(d.url) ? d.url : "#";
        html += `<p><b>${name}</b><br>
          <a href="${esc(safeUrl)}" target="_blank" rel="noopener">${esc(d.url)}</a><br>
          ${d.chars.toLocaleString()} chars, via ${esc(d.discovered_via)}, ${esc(d.fetch_method)} fetch,
          fetched ${esc(d.fetched_at.slice(0, 16).replace("T", " "))}<br>
          sha256 ${esc(d.content_hash.slice(0, 16))}... (version ${d.version_id})<br>
          history: ${d.history.map(h => `v${h.version_id} @ ${esc(h.fetched_at.slice(0, 10))}`).join(", ")}</p>
          <details><summary>show extracted text (${d.chars.toLocaleString()} chars)</summary>
          <pre>${esc(d.text)}</pre></details>`;
      }
      $("detail").innerHTML = html;
      $("detail").scrollIntoView({ behavior: "smooth" });
    } catch (err) { $("detail").textContent = "Error: " + err.message; }
  }

  loadCached();

  // --- live queue view (plain-text cells only: domains/stages come from crawled sites)
  const ago = (iso) => {
    if (!iso) return "";
    const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
    return s < 60 ? s + "s ago" : s < 3600 ? Math.round(s / 60) + "m ago" : Math.round(s / 3600) + "h ago";
  };
  function queueTable(rows, cols) {
    const t = document.createElement("table");
    const head = t.insertRow();
    for (const [label] of cols) { const th = document.createElement("th"); th.textContent = label; head.append(th); }
    for (const r of rows) {
      const tr = t.insertRow();
      for (const [, fn] of cols) tr.insertCell().textContent = fn(r);
    }
    return t;
  }
  async function loadQueue() {
    if (document.hidden) return;
    try {
      const r = await fetch("/api/queue");
      const d = await r.json();
      if (!r.ok) { $("queue").textContent = d.error || "error"; return; }
      const c = d.counts;
      $("queueCount").textContent = `(${c.running || 0} running, ${c.queued || 0} waiting, ${c.done || 0} done, ${c.failed || 0} failed)`;
      const box = $("queue"); box.replaceChildren();
      if (d.open.length) {
        box.append(queueTable(d.open, [
          ["domain", x => x.domain],
          ["status", x => x.status],
          ["step", x => x.status === "running" ? (x.stage || "") : `waiting (${ago(x.requested_at)})`],
          ["requests", x => x.request_count],
          ["from", x => x.source],
        ]));
      } else {
        box.append("(queue empty)");
      }
      if (d.recent.length) {
        const h = document.createElement("p"); h.textContent = "Recently finished:"; box.append(h);
        box.append(queueTable(d.recent, [
          ["domain", x => x.domain],
          ["result", x => x.status === "failed" ? "failed: " + (x.error || "") : (x.found && x.found.length ? "found " + x.found.join(" + ") : "nothing found")],
          ["took", x => x.started_at && x.finished_at ? ((new Date(x.finished_at) - new Date(x.started_at)) / 1000).toFixed(1) + "s" : ""],
          ["finished", x => ago(x.finished_at)],
        ]));
      }
    } catch { $("queue").textContent = "(could not load queue)"; }
  }
  loadQueue();
  setInterval(loadQueue, 3000);
  document.addEventListener("visibilitychange", loadQueue);

  // --- scorecard (all text set via textContent: quotes come from third-party sites)
  const TIER = {
    SEVERE:        { shape: "■", label: "SEVERE",        cls: "t-severe" },
    EXTENSIVE:     { shape: "▲", label: "EXTENSIVE",     cls: "t-extensive" },
    MODERATE:      { shape: "●", label: "MODERATE",      cls: "t-moderate" },
    LIMITED:       { shape: "○", label: "LIMITED",       cls: "t-limited" },
    NOT_DISCLOSED: { shape: "┄", label: "NOT DISCLOSED", cls: "t-nd" },
  };
  const node = (tag, text, cls) => { const n = document.createElement(tag); if (text != null) n.textContent = text; if (cls) n.className = cls; return n; };
  const tierBadge = (tier) => { const t = TIER[tier] || TIER.NOT_DISCLOSED; return node("span", `${t.shape} ${t.label}`, "tier " + t.cls); };

  function renderSite(site, note) {
    const box = $("results");
    box.replaceChildren();
    if (note) box.append(node("div", note, "muted"));
    const card = site.scorecard;
    const docs = site.documents.map(d => d.type === "privacy" ? "Privacy Policy" : "Terms of Service").join(" + ");
    if (!card) {
      box.append(node("p", `Documents found: ${docs || "none"}. Not analyzed yet — the scorecard appears once the worker has read them.`));
      for (const d of site.documents) {
        const p = node("p"); const a = node("a", d.url); a.href = safeHref(d.url); a.target = "_blank"; a.rel = "noopener";
        p.append(`${d.type}: `, a, ` (${d.chars.toLocaleString()} chars)`); box.append(p);
      }
      return;
    }
    const head = node("div", null, "card-head");
    head.append(node("span", site.domain, "card-domain"), tierBadge(card.headline));
    box.append(head);
    box.append(node("div", `Headline = worst category (${card.headline_categories.join(", ")}), not an average.`, "muted"));
    box.append(node("div", `Analyzed ${card.analyzed_at.slice(0, 10)} · ${docs} · rubric ${card.rubric_version}`, "muted"));

    const list = node("div", null, "cats");
    for (const c of card.categories) {
      const det = node("details", null, "cat");
      const sum = node("summary");
      sum.append(node("span", c.name, "cat-name"), tierBadge(c.tier),
                 node("span", c.findings.length ? ` ${c.findings.length} finding${c.findings.length > 1 ? "s" : ""}` : "", "muted"));
      det.append(sum);
      if (!c.findings.length) {
        det.append(node("div", c.tier === "NOT_DISCLOSED" ? "The documents don't address this." : "No verified findings.", "muted ev"));
      }
      for (const f of c.findings) {
        const ev = node("div", null, "ev");
        ev.append(node("div", f.meaning, "ev-claim"));
        for (const q of f.quotes) ev.append(node("blockquote", `“${q}”`));
        const meta = node("div", null, "muted");
        meta.append(`${f.document === "privacy" ? "Privacy Policy" : "Terms of Service"} · `,
                    node("span", "✓ quote verified", "ok"),
                    ` · ${f.provenance === "machine" ? "AI-generated" : f.provenance}` + (f.reused ? " · shared text, analyzed once" : ""));
        ev.append(meta);
        if (f.what_you_can_do) {
          const w = f.what_you_can_do;
          const todo = node("details", null, "todo");
          todo.append(node("summary", "What can you do?"));
          const ul = node("ul");
          for (const s of w.steps) {
            const li = node("li", s.text + " ");
            if (s.link) { const a = node("a", "link"); a.href = safeHref(s.link); a.target = "_blank"; a.rel = "noopener"; li.append(a); }
            ul.append(li);
          }
          const more = node("a", "More on this"); more.href = "/learn#" + encodeURIComponent(w.learn_anchor);
          todo.append(node("div", w.why, "muted"), ul, more);
          ev.append(todo);
        }
        det.append(ev);
      }
      list.append(det);
    }
    box.append(list);
  }

  async function showSite(domain, note) {
    const r = await fetch("/v1/sites/" + encodeURIComponent(domain));
    if (!r.ok) { $("results").textContent = "Error loading site"; return null; }
    const site = await r.json();
    renderSite(site, note);
    return site;
  }

  const docName = (t) => (t === "privacy" ? "privacy policy" : "terms of service");
  const safeHref = (u) => (/^https?:\/\//i.test(u || "") ? u : "#");
  const addLog = (msg) => { $("log").textContent += msg + "\n"; $("log").scrollTop = $("log").scrollHeight; };
  let currentDomain = null;

  // Fresh result from a finished queue job.
  function renderJob(job) {
    if (job.status === "failed") { $("results").textContent = "Analysis failed: " + (job.error || "unknown error"); return; }
    let out = "";
    for (const o of (job.result?.documents || [])) {
      if (o.found) {
        out += `<span class="ok">[FOUND]</span> ${docName(o.doc_type)}\n` +
               `        <a href="${esc(safeHref(o.url))}" target="_blank" rel="noopener">${esc(o.url)}</a>\n` +
               `        ${o.chars.toLocaleString()} chars, via ${esc(o.discovered_via)}, ${esc(o.fetch_method)} fetch — ${esc(o.status)}\n\n`;
      } else {
        out += `<span class="bad">[NOT FOUND]</span> ${docName(o.doc_type)}\n        ${esc(o.notes || "no candidate worked")}\n\n`;
      }
    }
    $("results").innerHTML = out || "(no documents)";
  }

  async function pollJob(id) {
    let shown = 0;
    while (true) {
      const r = await fetch("/v1/requests/" + id);
      const job = await r.json();
      if (!r.ok) { $("results").textContent = "Error: " + (job.error || r.status); return; }
      if (job.status === "queued") {
        $("results").textContent = job.queue_ahead > 0 ? `(queued — ${job.queue_ahead} ahead of you)` : "(queued — starting shortly)";
      } else {
        for (const line of job.progress.slice(shown)) addLog(line);
        shown = job.progress.length;
        if (job.status === "running") $("results").textContent = "(analyzing...)";
      }
      if (job.status === "done" || job.status === "failed") {
        const secs = job.started_at && job.finished_at ? ((new Date(job.finished_at) - new Date(job.started_at)) / 1000).toFixed(1) : "?";
        addLog(`${job.status} in ${secs}s`);
        renderJob(job);
        if (job.status === "done") await showSite(job.domain, "Fresh analysis.");
        loadCached();
        return;
      }
      await new Promise(res => setTimeout(res, 1000));
    }
  }

  async function analyze(domain, force) {
    $("go").disabled = true; $("recheck").disabled = true;
    $("log").textContent = ""; $("results").textContent = "(checking cache...)";
    try {
      if (!force) {
        const c = await fetch("/v1/sites/" + encodeURIComponent(domain));
        if (c.ok) {
          const site = await c.json();
          if (site.state === "ready") {
            currentDomain = site.domain;
            addLog(`${site.domain} is cached — served from the database, no crawl`);
            renderSite(site, "Cached result. Press \"Re-check now\" to crawl again.");
            return;
          }
        }
      }
      const r = await fetch("/v1/requests", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ domain, browser: $("pw").checked, refresh: force }),
      });
      const data = await r.json();
      if (!r.ok) { $("results").textContent = "Error: " + (data.error || r.status); return; }
      currentDomain = data.domain;
      if (data.status === "no_policy_found") {
        addLog(`${data.domain} was checked recently and no policy was found — answered from the database`);
        $("results").textContent = `No privacy policy or terms found on the last check. ` +
          `Next automatic re-check after ${(data.recheck_after || "").slice(0, 10)}; press "Re-check now" to crawl again.`;
        return;
      }
      if (data.status === "already_available") {
        addLog(`${data.domain} is cached — served from the database, no crawl`);
        await showSite(data.domain, "Cached result.");
        return;
      }
      addLog(data.created ? `queued ${data.domain} (request ${data.request_id})`
                          : `${data.domain} is already being analyzed — following that request`);
      await pollJob(data.request_id);
    } catch (err) {
      $("results").textContent = "Error: lost the server (" + err.message + ")";
    } finally {
      $("go").disabled = false;
      $("recheck").disabled = !currentDomain;
    }
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const domain = $("domain").value.trim();
    if (domain) analyze(domain, false);
  });
  $("recheck").addEventListener("click", () => { if (currentDomain) analyze(currentDomain, true); });

  // Type-ahead: /v1/search matches names and domains, typos allowed.
  let suggestTimer;
  $("domain").addEventListener("input", () => {
    clearTimeout(suggestTimer);
    const q = $("domain").value.trim();
    if (q.length < 2) return;
    suggestTimer = setTimeout(async () => {
      const r = await fetch("/v1/search?q=" + encodeURIComponent(q) + "&limit=8").catch(() => null);
      if (!r || !r.ok) return;
      const body = await r.json();
      $("suggest").replaceChildren(...body.results.map(s => {
        const o = document.createElement("option");
        o.value = s.domain;
        o.label = s.headline ? (TIER[s.headline] || TIER.NOT_DISCLOSED).label : "not rated yet";
        return o;
      }));
    }, 200);
  });
</script>
</body>
</html>
