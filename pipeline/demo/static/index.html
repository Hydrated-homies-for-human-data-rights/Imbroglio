<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imbroglio prototype</title>
<style>
  body { max-width: 800px; margin: 20px auto; padding: 0 10px; font-family: sans-serif; }
  #log { background: #f0f0f0; padding: 10px; min-height: 60px; max-height: 300px;
         overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
  #results { font-family: monospace; font-size: 14px; white-space: pre-wrap; }
  .ok { color: green; }
  .bad { color: red; }
</style>
</head>
<body>
  <h1>Imbroglio prototype</h1>
  <p>Type a website, it tries to find + extract the privacy policy and terms of service.
     <span id="db"></span></p>

  <form id="form">
    <input type="text" id="domain" placeholder="e.g. notion.so" size="30" autofocus>
    <button id="go" type="submit">Analyze</button>
    <label><input type="checkbox" id="pw" checked> browser fallback</label>
    <label><input type="checkbox" id="store" checked> save to db</label>
  </form>

  <h3>Log</h3>
  <div id="log">(waiting)</div>

  <h3>Results</h3>
  <div id="results">(none yet)</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  fetch("/api/health").then(r => r.json())
    .then(h => { $("db").textContent = h.db ? "(db: connected)" : "(db: offline, dry run)"; })
    .catch(() => { $("db").textContent = "(server unreachable)"; });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const domain = $("domain").value.trim();
    if (!domain) return;

    $("go").disabled = true;
    $("log").textContent = "";
    $("results").textContent = "(running...)";
    const addLog = (msg) => {
      $("log").textContent += msg + "\n";
      $("log").scrollTop = $("log").scrollHeight;
    };

    try {
      const resp = await fetch("/api/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ domain, playwright: $("pw").checked, store: $("store").checked }),
      });
      if (!resp.ok) {
        const data = await resp.json();
        $("results").textContent = "Error: " + (data.error || resp.status);
        return;
      }

      // NDJSON stream: log lines as they happen, then a final result line
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      let result = null;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          const msg = JSON.parse(line);
          if (msg.type === "log") addLog(msg.msg);
          else if (msg.type === "result") result = msg;
        }
      }
      if (!result) { $("results").textContent = "Error: stream ended without a result"; return; }
      if (result.error) { $("results").textContent = result.error; return; }

      addLog("done in " + result.seconds + "s");
      let out = "";
      for (const o of result.outcomes) {
        const name = o.doc_type === "privacy" ? "privacy policy" : "terms of service";
        if (o.found) {
          out += `<span class="ok">[FOUND]</span> ${name}\n`;
          out += `        <a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.url)}</a>\n`;
          out += `        ${o.chars.toLocaleString()} chars, via ${esc(o.discovered_via)}, ${esc(o.fetch_method)} fetch\n`;
          out += `        sha256 ${esc((o.content_hash || "").slice(0, 16))}...`;
          if (o.version_id) out += ` (version ${o.version_id})`;
          out += ` — ${esc(o.status)}\n\n`;
        } else {
          out += `<span class="bad">[NOT FOUND]</span> ${name}\n`;
          out += `        ${esc(o.notes || "no candidate worked")}\n\n`;
        }
      }
      $("results").innerHTML = out;
    } catch (err) {
      $("results").textContent = "Error: lost the server (" + err.message + ")";
    } finally {
      $("go").disabled = false;
    }
  });
</script>
</body>
</html>
