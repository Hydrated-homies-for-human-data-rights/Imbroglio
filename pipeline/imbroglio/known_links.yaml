# Known pages for exercising choices on the sites people use most. These
# live inside account settings, so the link harvest (links.py) never sees
# them on a homepage or policy. Each entry is a page the company itself
# documents; `checked` is when someone on the team last confirmed the
# address answers (logged-in pages redirect to a sign-in, which counts).
#
# Served through the same `links` field as the harvested ones, with source
# "known", and a known page wins over a harvested one for the same
# category. Keys are registrable domains; subdomains inherit them.
#
# Categories are the rubric's: selling_sharing, collection, retention,
# user_rights, security, ai_training, government.

github.com:
  - category: ai_training
    text: Copilot settings (AI model training)
    url: https://github.com/settings/copilot/features
    checked: 2026-11-03
  - category: retention
    text: Delete your account
    url: https://github.com/settings/admin
    checked: 2026-11-03

