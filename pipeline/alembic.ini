# Alembic CLI config. Database URL comes from IMBROGLIO_DB / DATABASE_URL
# (see imbroglio/migrations/env.py), never from this file.
#
#   alembic upgrade head          # apply pending migrations
#   alembic revision -m "add x"   # new migration (write SQL into UP / DOWN)
#   alembic history

[alembic]
script_location = imbroglio/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
